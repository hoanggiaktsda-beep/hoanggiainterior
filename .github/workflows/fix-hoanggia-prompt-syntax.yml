name: Fix HOANGGIA AI prompt syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix HOANGGIA AI prompt syntax' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix prompt expression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("HOANGGIA-AI/index.html")
          s=p.read_text(encoding="utf-8")
          old="designField('greeneryDirection','chỉ dùng khi phù hợp').',"
          new="designField('greeneryDirection','chỉ dùng khi phù hợp')+'.',"
          if old not in s:
              raise SystemExit("Expected syntax error not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hoanggia-prompt-syntax.yml
          git add HOANGGIA-AI/index.html
          git commit -m "Fix HOANGGIA AI prompt syntax"
          git push
