name: HOANGGIA AI syntax audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path("HOANGGIA-AI/index.html").read_text(encoding="utf-8")
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.I|re.S)
          Path("/tmp/inline.js").write_text("\n".join(scripts),encoding="utf-8")
          print("script blocks:",len(scripts),"bytes:",Path("/tmp/inline.js").stat().st_size)
          PY
          node --check /tmp/inline.js
