name: Fix HOANGGIA AI escaped newlines
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix HOANGGIA AI escaped newlines' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize escaped newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("HOANGGIA-AI/index.html")
          s=p.read_text(encoding="utf-8")
          token=chr(92)+"n"
          if token not in s:
              raise SystemExit("No escaped newline tokens found")
          p.write_text(s.replace(token,chr(10)),encoding="utf-8")
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hoanggia-escaped-newlines.yml
          git add HOANGGIA-AI/index.html
          git commit -m "Fix HOANGGIA AI escaped newlines"
          git push
