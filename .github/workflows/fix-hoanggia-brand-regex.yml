name: Fix HOANGGIA AI brand filter syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix HOANGGIA AI brand filter syntax' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Unicode regex
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("HOANGGIA-AI/index.html")
          s=p.read_text(encoding="utf-8")
          bs=chr(92)
          old="replace(/["+bs+bs+"u0300-"+bs+bs+"u036f]/g,'')"
          new="replace(/["+bs+"u0300-"+bs+"u036f]/g,'')"
          if old not in s:
              raise SystemExit("Expected brand filter regex not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hoanggia-brand-regex.yml
          git add HOANGGIA-AI/index.html
          git commit -m "Fix HOANGGIA AI brand filter syntax"
          git push
