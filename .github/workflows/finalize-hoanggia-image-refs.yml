name: Finalize HOANGGIA AI image reference fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'Finalize HOANGGIA AI image reference fixes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch image reference handling
        shell: python
        run: |
          from pathlib import Path
          p=Path("HOANGGIA-AI/index.html")
          s=p.read_text(encoding="utf-8")
          def rep(a,b):
              global s
              if a not in s:
                  raise SystemExit("Expected code block not found")
              s=s.replace(a,b,1)
          rep('''<div class="productRealRef" style="margin-top:14px;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)">
          <label>HÌNH ẢNH THAM CHIẾU THỰC TẾ</label>
          <div class="muted" style="margin-bottom:10px">Lấy ảnh không gian thực tế từ bên ngoài — ví dụ ảnh showroom, phòng khách, Pinterest hoặc website. Dùng ảnh này làm tham chiếu để tìm bối cảnh phù hợp với mẫu nội thất. Có thể thêm nhiều ảnh.</div>
          <div class="sourceRow"><input id="productRealRefUrl" type="url" placeholder="Dán URL trực tiếp của ảnh không gian thực tế (https://...)"><button type="button" class="secondary" onclick="addProductRealRefUrl()">THÊM ẢNH</button></div>
          <div id="productRealRefGallery" class="productGallery"></div>
          <div class="refStatus" id="productRealRefStatus">Ảnh tham chiếu thực tế sẽ được dùng để phân tích phong cách, tỷ lệ, vật liệu, ánh sáng và bối cảnh phù hợp.</div>
          </div>''',
          '''<div class="productRealRef" style="margin-top:14px;padding:14px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.025)">
          <label>HÌNH ẢNH THAM CHIẾU THỰC TẾ</label>
          <div class="muted" style="margin-bottom:10px">Lấy ảnh không gian thực tế từ bên ngoài — ví dụ ảnh showroom, phòng khách, Pinterest hoặc website. Dùng ảnh này làm tham chiếu để tìm bối cảnh phù hợp với mẫu nội thất. Có thể thêm nhiều ảnh.</div>
          <div class="sourceRow"><input id="productRealRefUrl" type="url" placeholder="Dán URL trực tiếp của ảnh không gian thực tế (https://...)"><button type="button" class="secondary" onclick="addProductRealRefUrl()">THÊM ẢNH</button></div>
          <div class="sourceRow"><button type="button" class="secondary" onclick="document.getElementById('productRealRefImage').click()">TỪ THIẾT BỊ</button><input id="productRealRefImage" type="file" accept="image/png,image/jpeg,image/webp,image/avif" multiple onchange="previewProductRealRefs(event)" style="display:none"></div>
          <div id="productRealRefGallery" class="productGallery"></div>
          <div class="refStatus" id="productRealRefStatus">URL phải là ảnh trực tiếp HTTPS. Nếu website nguồn chặn CORS, hãy dùng TỪ THIẾT BỊ để bảo đảm ảnh đi được vào bước tạo ảnh.</div>
          </div>''')
          rep('''function v(id){const el=document.getElementById(id);return el?String(el.value??''):''}
          let imageMeta={src:"",width:0,height:0,recommendations:[]};''',
          '''function v(id){const el=document.getElementById(id);return el?String(el.value??''):''}
          function cleanImageUrl(raw){const u=String(raw??'').trim().replace(/^["']|["']$/g,'');if(!u)return '';if(/^data:image\\//i.test(u)||/^blob:/i.test(u))return u;const x=new URL(u,location.href);if(x.protocol!=='https:')throw new Error('Chỉ hỗ trợ URL ảnh HTTPS để tránh lỗi mixed content trên GitHub Pages.');return x.href}
          function imageUrlErrorMessage(){return 'Không thể tải ảnh từ URL này. Hãy dùng URL ảnh trực tiếp HTTPS (JPG, PNG, WEBP) hoặc tải ảnh về máy rồi chọn “Từ thiết bị”. Một số trang như Pinterest/RedNote không cho trình duyệt đọc ảnh trực tiếp do CORS.'}
          function loadImageSource(src,onload,onerror){const img=new Image();img.onload=()=>onload(img);img.onerror=()=>onerror&&onerror();img.src=src;return img}
          let imageMeta={src:"",width:0,height:0,recommendations:[]};''')
          rep('''function setReference(src,label){const img=document.getElementById('preview');if(!img)return;img.onload=()=>{imageMeta={src,width:img.naturalWidth,height:img.naturalHeight,recommendations:[]};document.getElementById('refStatus').textContent='Đã nạp ảnh tham chiếu'+(label?' — '+label:'')+'.';img.style.display='block';analyzeImage()};img.onerror=()=>{document.getElementById('refStatus').textContent='Không thể đọc ảnh này. Nếu là URL web, hãy tải ảnh về máy rồi dùng “TỪ THIẾT BỊ”.'};img.removeAttribute('crossorigin');img.src=src}''',
          '''function setReference(src,label){const img=document.getElementById('preview');if(!img)return;try{src=cleanImageUrl(src)}catch(e){document.getElementById('refStatus').textContent=e.message;return}img.onload=()=>{imageMeta={src,width:img.naturalWidth,height:img.naturalHeight,recommendations:[]};document.getElementById('refStatus').textContent='Đã nạp ảnh tham chiếu'+(label?' — '+label:'')+'.';img.style.display='block';analyzeImage()};img.onerror=()=>{document.getElementById('refStatus').textContent=imageUrlErrorMessage()};img.removeAttribute('crossorigin');img.src=src}''')
          rep('''function clearProductImage(){productMeta={src:"",width:0,height:0,recommendations:[],images:[],realRefs:[]};const p=document.getElementById('productPreview');if(p){p.removeAttribute('src');p.style.display='none'}const g=document.getElementById('productGallery');if(g)g.innerHTML='';const f=document.getElementById('productImage');if(f)f.value='';const u=document.getElementById('productUrl');if(u)u.value='';document.getElementById('productStatus').textContent='Đã xóa toàn bộ ảnh model.';document.getElementById('productAnalysis').style.display='none'}''',
          '''function clearProductImage(){productMeta={src:"",width:0,height:0,recommendations:[],images:[],realRefs:[]};const p=document.getElementById('productPreview');if(p){p.removeAttribute('src');p.style.display='none'}const g=document.getElementById('productGallery');if(g)g.innerHTML='';const f=document.getElementById('productImage');if(f)f.value='';const u=document.getElementById('productUrl');if(u)u.value='';const rg=document.getElementById('productRealRefGallery');if(rg)rg.innerHTML='';const rf=document.getElementById('productRealRefImage');if(rf)rf.value='';const ru=document.getElementById('productRealRefUrl');if(ru)ru.value='';const rs=document.getElementById('productRealRefStatus');if(rs)rs.textContent='Đã xóa ảnh tham chiếu thực tế.';document.getElementById('productStatus').textContent='Đã xóa toàn bộ ảnh model.';document.getElementById('productAnalysis').style.display='none'}''')
          rep('''function renderProductRealRefs(){const g=document.getElementById('productRealRefGallery');if(!g)return;g.innerHTML=productMeta.realRefs.map((im,i)=>'<div class="productThumb"><img src="'+im.src+'" alt="Ảnh tham chiếu thực tế '+(i+1)+'"><span>THAM CHIẾU THỰC TẾ · '+(im.label||('Ảnh '+(i+1)))+'</span><button type="button" onclick="removeProductRealRef('+i+')">×</button></div>').join('')}''',
          '''function renderProductRealRefs(){const g=document.getElementById('productRealRefGallery');if(!g)return;g.innerHTML='';productMeta.realRefs.forEach((im,i)=>{const card=document.createElement('div');card.className='productThumb';const img=document.createElement('img');img.src=im.src;img.alt='Ảnh tham chiếu thực tế '+(i+1);const tag=document.createElement('span');tag.textContent='THAM CHIẾU THỰC TẾ · '+(im.label||('Ảnh '+(i+1)));const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.onclick=()=>removeProductRealRef(i);card.append(img,tag,btn);g.appendChild(card)})}''')
          rep('''function addProductRealRefUrl(){const u=document.getElementById('productRealRefUrl').value.trim();const s=document.getElementById('productRealRefStatus');if(!u){s.textContent='Hãy dán URL trực tiếp của ảnh.';return}try{new URL(u);productMeta.realRefs.push({src:u,label:'Ảnh từ bên ngoài'});renderProductRealRefs();document.getElementById('productRealRefUrl').value='';s.textContent='Đã thêm ảnh tham chiếu thực tế. Nếu ảnh không hiển thị do website chặn truy cập, hãy tải ảnh về máy rồi dùng mục Hình ảnh tham chiếu / hiện trạng.'}catch(e){s.textContent='URL chưa hợp lệ.'}}''',
          '''function addProductRealRefUrl(){const raw=document.getElementById('productRealRefUrl').value.trim();const s=document.getElementById('productRealRefStatus');if(!raw){s.textContent='Hãy dán URL trực tiếp của ảnh.';return}let u='';try{u=cleanImageUrl(raw)}catch(e){s.textContent=e.message;return}if(productMeta.realRefs.some(x=>x.src===u)){s.textContent='Ảnh này đã được thêm.';return}s.textContent='Đang kiểm tra ảnh…';loadImageSource(u,()=>{productMeta.realRefs.push({src:u,label:'Ảnh từ bên ngoài'});renderProductRealRefs();document.getElementById('productRealRefUrl').value='';s.textContent='Đã thêm ảnh tham chiếu thực tế.'},()=>{s.textContent=imageUrlErrorMessage()})}''')
          rep('''function removeProductRealRef(i){productMeta.realRefs.splice(i,1);renderProductRealRefs();document.getElementById('productRealRefStatus').textContent=productMeta.realRefs.length?'Còn '+productMeta.realRefs.length+' ảnh tham chiếu thực tế.':'Đã xóa ảnh tham chiếu thực tế.'}''',
          '''async function previewProductRealRefs(e){const files=[...(e.target.files||[])];const st=document.getElementById('productRealRefStatus');if(!files.length)return;st.textContent='Đang đọc '+files.length+' ảnh…';try{for(const f of files){const src=await readImageFile(f);productMeta.realRefs.push({src,label:f.name})}renderProductRealRefs();st.textContent='Đã thêm '+productMeta.realRefs.length+' ảnh tham chiếu thực tế.'}catch(err){st.textContent=err.message||'Không thể đọc ảnh.'}finally{e.target.value=''}}
          function removeProductRealRef(i){productMeta.realRefs.splice(i,1);renderProductRealRefs();document.getElementById('productRealRefStatus').textContent=productMeta.realRefs.length?'Còn '+productMeta.realRefs.length+' ảnh tham chiếu thực tế.':'Đã xóa ảnh tham chiếu thực tế.'}''')
          rep('''function renderProductGallery(){const g=document.getElementById('productGallery');if(!g)return;g.innerHTML=productMeta.images.map((im,i)=>'<div class="productThumb"><img src="'+im.src+'" alt="Model sản phẩm '+(i+1)+'"><span>'+((i===0?'MODEL CHÍNH · ':'MODEL '+(i+1)+' · ')+(im.label||'ẢNH THAM CHIẾU'))+'</span><button type="button" onclick="removeProductImage('+i+')">×</button></div>').join('')}''',
          '''function renderProductGallery(){const g=document.getElementById('productGallery');if(!g)return;g.innerHTML='';productMeta.images.forEach((im,i)=>{const card=document.createElement('div');card.className='productThumb';const img=document.createElement('img');img.src=im.src;img.alt='Model sản phẩm '+(i+1);const tag=document.createElement('span');tag.textContent=(i===0?'MODEL CHÍNH · ':'MODEL '+(i+1)+' · ')+(im.label||'ẢNH THAM CHIẾU');const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.onclick=()=>removeProductImage(i);card.append(img,tag,btn);g.appendChild(card)})}''')
          rep('''function addProductReference(src,label){const img=new Image();img.onload=()=>{productMeta.images.push({src,label:label||'Ảnh model',width:img.naturalWidth,height:img.naturalHeight});if(productMeta.images.length===1){productMeta.src=src;productMeta.width=img.naturalWidth;productMeta.height=img.naturalHeight}renderProductGallery();document.getElementById('productStatus').textContent='Đã thêm '+productMeta.images.length+' ảnh model. Ảnh đầu là model chính.';analyzeProduct()};img.onerror=()=>document.getElementById('productStatus').textContent='Không thể đọc ảnh model này. Nếu là ảnh trong máy, hãy chọn lại tệp ảnh.';img.src=src}''',
          '''function addProductReference(src,label){let u='';try{u=cleanImageUrl(src)}catch(e){document.getElementById('productStatus').textContent=e.message;return}if(productMeta.images.some(x=>x.src===u)){document.getElementById('productStatus').textContent='Ảnh model này đã được thêm.';return}loadImageSource(u,img=>{productMeta.images.push({src:u,label:label||'Ảnh model',width:img.naturalWidth,height:img.naturalHeight});if(productMeta.images.length===1){productMeta.src=u;productMeta.width=img.naturalWidth;productMeta.height=img.naturalHeight}renderProductGallery();document.getElementById('productStatus').textContent='Đã thêm '+productMeta.images.length+' ảnh model. Ảnh đầu là model chính.';analyzeProduct()},()=>{document.getElementById('productStatus').textContent=imageUrlErrorMessage()})}''')
          rep('''async function blobToBase64(src){const res=await fetch(src);if(!res.ok)throw new Error('Không thể đọc ảnh');const blob=await res.blob();const mime=blob.type||'image/jpeg';return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve({mime,data:String(fr.result).split(',')[1]});fr.onerror=reject;fr.readAsDataURL(blob)})}''',
          '''async function blobToBase64(src){if(/^data:image\\//i.test(src)){const parts=String(src).split(',');return {mime:(parts[0].match(/^data:([^;]+)/i)||[])[1]||'image/jpeg',data:parts.slice(1).join(',')}}if(/^blob:/i.test(src)){const res=await fetch(src);if(!res.ok)throw new Error('Không thể đọc ảnh');const blob=await res.blob();return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve({mime:blob.type||'image/jpeg',data:String(fr.result).split(',')[1]});fr.onerror=reject;fr.readAsDataURL(blob)})}const res=await fetch(cleanImageUrl(src),{mode:'cors'});if(!res.ok)throw new Error('Không thể đọc ảnh');const blob=await res.blob();if(!blob.type.startsWith('image/'))throw new Error('URL không trả về dữ liệu ảnh');return await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve({mime:blob.type||'image/jpeg',data:String(fr.result).split(',')[1]});fr.onerror=reject;fr.readAsDataURL(blob)})}''')
          rep('''if(productModeAvailable()&&productMeta.realRefs.length){for(const item of productMeta.realRefs){try{const ri=await blobToBase64(item.src);input.push({type:'image',mime_type:ri.mime,data:ri.data});}catch(err){throw new Error('Không đọc được ảnh tham chiếu thực tế từ URL này do giới hạn trình duyệt. Hãy tải ảnh về thiết bị rồi thêm lại.');}}}''',
          '''if(productModeAvailable()&&productMeta.realRefs.length){for(const item of productMeta.realRefs){try{const ri=await blobToBase64(item.src);input.push({type:'image',mime_type:ri.mime,data:ri.data});}catch(err){throw new Error('Không đọc được ảnh tham chiếu thực tế. Trình duyệt/website nguồn đang chặn CORS; hãy dùng ảnh TỪ THIẾT BỊ để tạo ảnh trực tiếp.');}}}''')
          rep('''if(productModeAvailable()&&productMeta.images.length){for(const item of productMeta.images){try{const pi=await blobToBase64(item.src);input.push({type:'image',mime_type:pi.mime,data:pi.data});}catch(err){throw new Error('Không đọc được một ảnh model sản phẩm do giới hạn trình duyệt. Hãy tải ảnh về thiết bị rồi chọn “Từ thiết bị”.');}}}''',
          '''if(productModeAvailable()&&productMeta.images.length){for(const item of productMeta.images){try{const pi=await blobToBase64(item.src);input.push({type:'image',mime_type:pi.mime,data:pi.data});}catch(err){throw new Error('Không đọc được một ảnh model sản phẩm. Nếu là URL bên ngoài, website nguồn có thể đang chặn CORS; hãy tải ảnh về máy rồi chọn “Từ thiết bị”.');}}}''')
          p.write_text(s,encoding="utf-8")
      - name: Commit final patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/finalize-hoanggia-image-refs.yml
          git add HOANGGIA-AI/index.html
          git commit -m "Finalize HOANGGIA AI image reference fixes"
          git push
